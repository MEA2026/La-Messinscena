name: Pubblica La Messinscena

on:
	push:
		branches:
			- main
	workflow_dispatch:

permissions:
	contents: read
	pages: write
	id-token: write

concurrency:
	group: pages
	cancel-in-progress: true

jobs:
	build:
		runs-on: ubuntu-latest
		steps:
			- name: Scarica il repository
				uses: actions/checkout@v4

			- name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

			- name: Installa le dipendenze
				run: npm install

			- name: Compila l'app
				run: npm run build

			- name: Prepara GitHub Pages
				uses: actions/configure-pages@v5

			- name: Carica i file compilati
				uses: actions/upload-pages-artifact@v3
				with:
					path: ./dist

	deploy:
		environment:
			name: github-pages
			url: ${{ steps.deployment.outputs.page_url }}
		runs-on: ubuntu-latest
		needs: build
		steps:
			- name: Pubblica il sito
				id: deployment
				uses: actions/deploy-pages@v4
